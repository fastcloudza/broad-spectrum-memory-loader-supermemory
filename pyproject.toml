[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "broad-spectrum-conversation-memory-loader"
version = "0.1.0"
description = "Load multi-channel customer conversations into Supermemory as speaker-attributed text."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["supermemory>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conversation-memory-loader = "conversation_memory_loader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
